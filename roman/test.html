<!doctype html><html><head><meta charset=utf-8><style>body{margin:0;background:#000}canvas{display:block}</style>
<script type=importmap>{"imports":{"three":"./three.module.js"}}</script></head><body>
<canvas id=c width=1080 height=1920></canvas>
<script type=module>
import * as THREE from 'three';
import { RoomEnvironment } from './RoomEnvironment.js';
import * as L from './lib.js';
const r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setSize(1080,1920,false);r.shadowMap.enabled=true;r.toneMapping=THREE.ACESFilmicToneMapping;r.outputColorSpace=THREE.SRGBColorSpace;
const s=new THREE.Scene();s.background=new THREE.Color(0x9cc6ef);
s.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),0.04).texture;s.environmentIntensity=0.6;
s.add(new THREE.HemisphereLight(0xdfefff,0x6a5a48,1.4));const d=new THREE.DirectionalLight(0xfff1dc,3);d.position.set(4,8,6);d.castShadow=true;d.shadow.mapSize.set(2048,2048);
Object.assign(d.shadow.camera,{left:-4,right:4,top:4,bottom:-4});d.shadow.bias=-0.0005;s.add(d);
const g=L.mesh(new THREE.PlaneGeometry(40,40),L.mat(0x8f9a7a));g.rotation.x=-Math.PI/2;s.add(g);
const cam=new THREE.PerspectiveCamera(30,1080/1920,0.1,200);
const H=L.makeHuman({outfit:'roman'});s.add(H.root);L.holdIn(H,H.shield,'L',[0.12,-0.05,0.1],[0,Math.PI/2,0]);L.holdIn(H,H.sword,'R',[0,-0.08,0.02],[Math.PI/2,0,0]);
const G=L.makeHuman({shirt:0xf28ab2,pants:0x37415a,hairStyle:'bun',hair:0x5a3420,skin:0xf0c4a0,phone:true,bulk:0.9,scale:0.93});s.add(G.root);
window.show=(mode)=>{
 if(mode===0){L.applyPose(H,L.pose({x:-0.5,ry:0.3,mouthOpen:0.6,browL:0.3,browR:0.3,browUp:0.6,eyeSize:1.2,lShX:0.6,lEl:1.3,rShX:0.3,rEl:0.6}));L.updateCape(H,1,0);
  L.applyPose(G,L.pose({x:0.8,ry:-0.3,mouthSmile:0.5}));cam.position.set(0,1.6,6.5);cam.lookAt(0,1.1,0);}
 if(mode===1){L.applyPose(H,L.pose({ry:0.25,mouthOpen:0.9,browL:-0.35,browR:-0.35,eyeSize:1.0}));cam.position.set(0.3,1.95,1.7);cam.lookAt(0,1.85,0);G.root.visible=false;}
 if(mode===2){L.applyPose(H,L.walkPose(L.pose({ry:2.4}),1.2));L.updateCape(H,1,4);cam.position.set(2.5,1.6,-3);cam.lookAt(0,1.2,0);G.root.visible=false;}
 r.render(s,cam);};
window.ready=true;
</script></body></html>
